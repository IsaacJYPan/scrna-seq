name: CI Pipeline

# Private-repo GitHub Actions minutes are limited, so the full CI suite runs
# on pull requests (which already test the merge result) plus manual dispatch.
# The post-merge push-to-main run is intentionally omitted to avoid a duplicate
# full run of the same code; trigger it by hand via workflow_dispatch if needed.
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::Seurat
            any::plumber
            any::ggplot2
            any::dplyr
            any::RColorBrewer
            any::jsonlite
            any::base64enc
            any::digest

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Frontend Tests
        run: npm run test:frontend

      - name: Run Backend Tests
        run: npm run test:backend

      - name: Run Security Tests
        # Per-user DB isolation + analysis-object identity/ownership, the
        # R-proxy X-Object-ID ownership contract, and durable job ownership /
        # status-machine enforcement. These guard the regression where a stale
        # pre-rebase branch reintroduced unscoped cross-user deletes and
        # client-controlled R state keys.
        #
        # Also runs the pre-collaboration security cleanup regressions:
        #   auth-ratelimit      (finding 1: 429 on rapid login/signup)
        #   r-diagnostic-gate   (finding 2: //__test, %2F__test gated to 404)
        #   r-path-drift        (finding 4: R validate_path fields vs Node allowlist)
        #   auth-credentials    (finding 7: generic 401, no user-enumeration message)
        #   security/analysis-objects (findings 5, 6, 9: figure path, owner-required helpers, datasetId caveat)
        #   organizations       (org/project membership + authorization foundation:
        #                        404-vs-403 access rules, server-controlled ids/owner/role,
        #                        last-owner invariant, owner/admin-only mutations)
        #   datasets            (project-scoped datasets: role-checked create/read/update,
        #                        404-vs-403 access rules, server-controlled ids/owner/storage,
        #                        file_type/status allow-lists, upload sha256/size + server-chosen
        #                        storage key, and datasetId verification on analysis objects/jobs)
        #   project-analysis-resources (project-scoped analysis objects/jobs: role-checked
        #                        create + project-member metadata/history reads, 404-vs-403
        #                        access rules, server-controlled ids/owner/project/status,
        #                        same-project dataset/parent/lineage/result references, cancel
        #                        policy by role, and proof that project membership does NOT
        #                        widen R object/state ownership)
        #   project-provenance-figures (project-scoped provenance/figure metadata: role-checked
        #                        append-only create + project-member reads, 404-vs-403 access
        #                        rules, server-controlled ids/owner/project/actor, same-project
        #                        dataset/object/job/result/provenance/parent references, NO figure
        #                        file_path/storage-key acceptance and no raw path in responses,
        #                        legacy NULL-project rows not leaked, and proof that referencing
        #                        an object in metadata does NOT widen R object/state ownership)
        #   jobs-worker-contract (durable job-worker coordination contract/schema: idempotent
        #                        additive migration + legacy-row readability, single-winner
        #                        claim, priority/created_at ordering, terminal/canceled jobs
        #                        unclaimable, lease expiry recovery (requeue vs fail by
        #                        max_attempts), heartbeat/complete/fail/release restricted to the
        #                        claim-token-holding worker, cancel voiding a live claim, the
        #                        running→queued re-queue edge, claim_token never exposed by read
        #                        APIs, and proof worker activity does NOT widen R object ownership;
        #                        NO worker runs — contract + schema only)
        #   job-worker          (minimal worker drain over the contract: idle no-op,
        #                        claim→heartbeat→complete of a supported `generic` noop
        #                        handler with durable logs, handler-error failure, unsupported
        #                        job type claimed-then-failed (UNSUPPORTED_JOB_TYPE, terminal),
        #                        single-winner claim, canceled-queued unclaimable, cancel-during-
        #                        handler claim-loss no-op (not resurrected), expired-lease reap
        #                        requeue/fail + stale worker cannot complete after reap, live
        #                        lease untouched, claim_token never exposed by owner reads,
        #                        clean start/stop with no leaked timers, worker disabled by
        #                        default, and proof processing a job does NOT widen R object
        #                        ownership)
        #   job-worker-runtime  (worker RUNTIME hardening: deterministic + safe env config
        #                        parsing (ENABLE_JOB_WORKER exact "true" only; invalid
        #                        poll/lease fall back to documented defaults with a sanitized
        #                        warning that never echoes the raw value), opt-in startup
        #                        wiring (no worker unless enabled, importing the server does
        #                        not start one, single-loop idempotency, config passthrough,
        #                        no claim-token/secret exposure), safe stop (no-worker / double
        #                        stop), graceful shutdown (awaits worker stop, bounded by a
        #                        timeout so it never hangs, exits non-zero on stop failure with
        #                        a sanitized log, leaks no timers), and DB busy_timeout init;
        #                        NO R execution, NO artifacts, NO shared R state)
        #   job-artifacts-checkpoints (durable artifact/checkpoint METADATA model: idempotent
        #                        additive job_artifacts migration + indexes, artifact-type/
        #                        storage-kind/status allow-lists, server-generated art_ ids with
        #                        client id/project/creator/storage-uri/checksum/size ignored,
        #                        same-scope-only references (no cross-project/owner leak),
        #                        claim-guarded worker-only create (no public create route),
        #                        single immutable result checkpoint object per successful job
        #                        (CHECKPOINT_EXISTS / no duplicate by two workers; failed/
        #                        canceled jobs create none), checkpoint.noop placeholder handler
        #                        end-to-end with metadata-only artifact + durable logs while
        #                        generic stays a noop and unsupported types still fail terminally,
        #                        role-checked project read routes (404-vs-403, 400 malformed ids),
        #                        no storage_uri/path/storage-key/claim-token/worker-internal in
        #                        responses, legacy NULL-project artifacts not leaked, and proof a
        #                        co-member reading a checkpoint cannot access it via /api/r/*;
        #                        NO download, NO object storage, NO real R/Seurat outputs)
        #   r-worker-bridge     (minimal worker-to-R bridge: ONE allowlisted, read-only,
        #                        metadata-only R operation (r.runtime.check → R /health) invoked
        #                        through server-controlled code — arbitrary operation names,
        #                        client-supplied R code/path/endpoint/method/state-key all
        #                        ignored/rejected (input is server-derived); explicit timeout +
        #                        sanitized errors (no raw R error/stack/internal URL leaks); one
        #                        metadata-only r_runtime_check artifact on success with NO
        #                        checkpoint/result object, NO analysis-object access, NO mutation;
        #                        failed/canceled/claim-lost jobs finalize no artifact and two
        #                        workers cannot duplicate one; role-checked project artifact reads
        #                        omit storage-uri/path/state-key/claim-token/worker/R-URL; and
        #                        proof the bridge does NOT widen live-R object access for a project
        #                        co-member (membership ≠ live-R ownership); NO public bridge/worker
        #                        route, NO download, NO arbitrary R, NO real R/Seurat pipeline)
        #   r-object-inspect    (read-only worker-to-R object inspection: ONE allowlisted,
        #                        read-only, metadata-only operation (r.object.inspect → R
        #                        GET /object/inspect) over server-derived object context — the
        #                        object id comes from the TRUSTED job row, the X-Object-ID /
        #                        R state key is SERVER-derived (never client-provided), and
        #                        arbitrary operation/code/path/endpoint/method/state-key are
        #                        impossible (default caller also defense-in-depth target-allowlists);
        #                        the live-R object OWNER gate (verifyAnalysisObjectOwner) runs
        #                        BEFORE any R contact so a project co-member/admin cannot inspect
        #                        another user's live object (membership ≠ live-R access), with
        #                        cross-project 404, legacy-object 404, malformed 400, unknown 404,
        #                        viewer 403, and missing-object fail-before-R; inspection mutates
        #                        NOTHING and creates NO checkpoint/result object (object byte-stable
        #                        across repeats); ONE metadata-only r_object_inspection artifact on
        #                        success with sanitized bounded summary (no expression/cell/gene/
        #                        embedding/path/state-key/serialized data); failed/canceled/claim-
        #                        lost jobs finalize no artifact and two workers cannot duplicate one;
        #                        role-checked project artifact reads omit storage-uri/path/state-key/
        #                        claim-token/worker/R-URL; deriveRStateKey stays server-derived and
        #                        /api/r/* still rejects a co-member's cross-user object id; NO
        #                        download, NO object storage, NO arbitrary R, NO real R/Seurat pipeline)
        #   analysis-object-lineage-dag (DAG-ready analysis-object lineage edge model:
        #                        idempotent additive analysis_object_edges migration + indexes
        #                        (incl. the COALESCE(job_id,'') unique index), one-time idempotent
        #                        backfill of existing single-parent links as derived_from edges with
        #                        cross-project links NOT backfilled, server-generated aoe_ ids with
        #                        client project/creator/internal fields ignored, malformed ids 400 /
        #                        unknown-or-cross-scope refs 404 / self-parent 400 / duplicate 409 /
        #                        direct+indirect cycle 409, branching (two children of one parent)
        #                        and multi-parent children representable + traversable, checkpoint
        #                        completion creating exactly one job-linked checkpoint edge while
        #                        failed/canceled/claim-lost/duplicate completions create none,
        #                        role-checked read-only parents/children/lineage routes (404-vs-403,
        #                        400 malformed, cross-project/legacy-NULL-project objects not leaked),
        #                        responses omitting storage-uri/path/state-key/claim-token/worker
        #                        internals, deterministic bounded graph, and proof a co-member who can
        #                        read lineage still cannot use a checkpoint object via /api/r/*; the
        #                        single-parent parent_object_id/lineage_root_id stay compatibility/
        #                        fast-path fields; NO named branches, NO merge/integration semantics,
        #                        NO mutating R/Seurat pipeline, NO download/object storage)
        #   pbmc-pipeline-worker (first production-integrated scientific pipeline: the existing
        #                        PBMC/Seurat preprocessing path wrapped as ONE allowlisted
        #                        `pbmc.pipeline.v1` worker job + `r.pbmc.pipeline.v1` bridge op.
        #                        Scope: only this type added; generic/checkpoint.noop/r.runtime.check/
        #                        r.object.inspect unchanged; unsupported types still terminal; NO
        #                        DEG/pathway/CellChat registered; NO public worker/R-bridge/download
        #                        route. Params: fixed server-side allowlist (defaults recorded;
        #                        unknown rejected; strings never coerced so no param becomes R code/
        #                        path/function; invalid → failed-before-R; resolved params in safe
        #                        metadata). Ownership: input object id from the TRUSTED job row; the
        #                        job creator must OWN the live object (verifyAnalysisObjectOwner)
        #                        BEFORE any R contact and the X-Object-ID is SERVER-derived
        #                        (deriveRObjectStateKey) — a co-member/admin/viewer/non-member/cross-
        #                        project/legacy/malformed object cannot run it. Bridge: only the
        #                        allowlisted op runs; arbitrary op/code/path/endpoint/method/state-key
        #                        rejected/impossible; the params body is server-rebuilt from the
        #                        allowlist + a SERVER-allocated checkpoint key; sanitized errors (no
        #                        R URL/token/state-key/stack leak). Success: completes via the worker
        #                        contract creating EXACTLY one result object + one parent→result
        #                        checkpoint edge + one local_internal checkpoint artifact (checksum/
        #                        size; storage_uri stripped from public reads) + one metadata-only
        #                        pipeline_summary artifact; links result_analysis_object_id; same
        #                        project/lineage-root; parent unchanged. Failure/cancel/claim-loss/
        #                        absent-checkpoint create NO successful result/edge/artifact and two
        #                        workers cannot duplicate one; checkpoint key is server-controlled +
        #                        traversal-proof; NO download route; NO arbitrary R)
        # NOTE: every backend/*.test.js already runs in the "Run Backend Tests"
        # step (npm run test:backend); this step names the security-critical
        # suites explicitly so the regression coverage is auditable.
        run: npx vitest run backend/security.test.js backend/server-security.test.js backend/analysis-objects.test.js backend/r-proxy-ownership.test.js backend/jobs.test.js backend/jobs-worker-contract.test.js backend/job-worker.test.js backend/job-worker-runtime.test.js backend/job-artifacts-checkpoints.test.js backend/r-worker-bridge.test.js backend/r-object-inspect.test.js backend/analysis-object-lineage-dag.test.js backend/pbmc-pipeline-worker.test.js backend/organizations.test.js backend/datasets.test.js backend/project-analysis-resources.test.js backend/project-provenance-figures.test.js backend/auth-ratelimit.test.js backend/auth-credentials.test.js backend/r-diagnostic-gate.test.js backend/r-path-drift.test.js --environment node

      - name: Run R State Proxy Isolation Test
        # Live Express + R Plumber check proving DB-backed per-object R state
        # isolation (malformed/unknown/cross-user X-Object-ID rejected before
        # reaching R). Requires the R backend set up above.
        run: npm run test:r-state-proxy

      - name: Run Visual/UX Tests
        run: npm run test:visual

      - name: Build Application
        run: npm run build
