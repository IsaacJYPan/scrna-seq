name: CI Pipeline

# Private-repo GitHub Actions minutes are limited, so the full CI suite runs
# on pull requests plus manual dispatch.
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

# A newer push makes an older run irrelevant. Cancel it before it can continue
# consuming time in the R, container, and browser certification stages.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/scrna_test
  NODE_ENV: test

jobs:
  preflight:
    name: Fast release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scrna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run local-equivalent release preflight
        # This exact command is available to contributors locally. It runs the
        # dependency audit, lint, declarative Compose policy check, frontend,
        # every backend test against real Postgres, the development supervisor
        # contract, and the production build before costly certification starts.
        run: npm run check:ci-preflight

  browser-preflight:
    name: Browser release preflight
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scrna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium for preflight
        run: npx playwright install --with-deps chromium

      - name: Run local-equivalent browser preflight
        # These fast browser contracts previously ran after the R/scientific
        # suite. Gate expensive work on them instead.
        run: npm run check:browser-preflight

  test:
    needs: browser-preflight
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 150

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scrna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install PostgreSQL client tools
        # The real backup/restore drill uses pg_dump and pg_restore against the
        # isolated CI service database.
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Validate and build deployable Node images
        run: |
          docker build --check --target runtime .
          docker build --check -f r-backend/Dockerfile r-backend
          docker build --target runtime -t traceomics:ci .
          docker build --target operations -t traceomics-operations:ci .

      - name: Boot Compose and run containerized backup/restore drill
        # Uses the real hardened Node/Postgres/operations images and namespace.
        # A tiny authenticated R health stub replaces only the expensive R image.
        # Proves non-root service startup, web/worker health, mounted-volume
        # layout, offline backup, read-only-input restore, verification, and
        # restart from the restored candidate.
        run: npm run test:deployment:compose-runtime

      - name: Setup R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          packages: |
            any::Seurat
            any::plumber
            any::ggplot2
            any::dplyr
            any::RColorBrewer
            any::jsonlite
            any::base64enc
            any::digest
            any::hdf5r
            any::clusterProfiler
            any::fgsea
            any::AnnotationDbi
            any::org.Hs.eg.db
            any::org.Mm.eg.db
            any::GO.db
            any::BiocNeighbors
            any::NMF
            github::immunogenomics/presto@a24772a135c7895a8183b007376050556c60a05b
            github::jinworks/CellChat@a0d3b2d231d46c8787177fffeac908270c253747

      - name: Install Playwright Browsers
        # Every browser acceptance script in this repository launches Chromium;
        # avoid downloading unused Firefox and WebKit runtimes on each CI run.
        run: npx playwright install --with-deps chromium

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run real backup and restore drill
        # Creates an isolated source DB, writes durable dataset/artifact bytes,
        # runs real pg_dump + pg_restore into a new DB/roots, verifies hashes,
        # references, and every public table fingerprint, then removes both DBs.
        run: npm run test:backup-restore:real

      - name: Run production process smoke test
        # Boots the actual production server with Postgres and a private fake R
        # service. Exercises fail-fast config, health/readiness degradation,
        # secure cookie + headers, CSRF, single-web locking, session revocation,
        # graceful drain, and stable public error boundaries.
        run: npm run test:deployment:smoke

      - name: Run R State Proxy Isolation Test
        # Live Express + R check for owner-scoped DB-backed R object state.
        run: npm run test:r-state-proxy

      - name: Run PBMC Pipeline Parent-Immutability Smoke Test
        run: npm run test:pbmc-parent

      - name: Download PBMC3k Sample Data
        run: node scripts/download_sample_data.js

      - name: Run Seurat Pipeline End-to-End Smoke Test
        # Real R + standalone worker, observed lease renewals, competing claimant,
        # checkpoint output, and one terminal completion.
        run: npm run test:seurat-pipeline

      - name: Run DEG Worker Pipeline Lease-Renewal Smoke Test
        # Real R + standalone worker for deg.find_markers.v1 specifically: a real,
        # delayed FindAllMarkers call over a small synthetic clustered checkpoint,
        # observed lease renewals, a rejected competing claimant, and completion with
        # the expected deg_markers/deg_summary artifacts. The DEG-mocked worker suite
        # (part of Run Backend Tests) proves the contract; this proves the same real-R
        # lease-renewal property that Run Seurat Pipeline End-to-End Smoke Test proves
        # for seurat.pipeline.v1.
        run: npm run test:deg-worker-pipeline

      - name: Run Checkpoint-Load Reattach Smoke Test
        run: npm run test:checkpoint-load

      - name: Run Durable Storage Path Tests
        run: npm run test:r-storage

      - name: Run Public R Endpoint Bound Tests
        run: npm run test:r-public-bounds

      - name: Run Live R Revision Recovery Tests
        run: npm run test:r-live-revisions

      - name: Run DEG Find-Markers Smoke Test
        run: npm run test:deg-markers

      - name: Run Ranked Pathway-Enrichment Smoke Test
        run: npm run test:enrichment-gsea

      - name: Run CellChat Inference Smoke Test
        # Real R/Seurat/CellChat helper coverage: deterministic bounded sampling,
        # opaque group labels, receipt-safe summary schema, private CSV output, and
        # input-object/RNG non-mutation. It does not claim browser integration.
        run: npm run test:cellchat-inference

      - name: Verify CellChat R-to-Node receipt interoperability
        # Uses a receipt emitted by the real R CellChat smoke to prove that the
        # Node worker can authenticate and reconstruct the recovery descriptor.
        run: npm run test:cellchat-receipt-interop

      - name: Run CellChat durable worker receipt-recovery smoke test
        # Real Postgres + standalone workers + spawned R/CellChat. The first
        # successful R response is deliberately disconnected after it writes its
        # private CSV and signed receipt; the bounded recovery-only claim must
        # publish that exact output without executing CellChat a second time.
        run: npm run test:cellchat-worker-pipeline

      - name: Run Visual/UX Tests
        # Generated screenshots stay outside version control. CI checks the
        # browser flows, accessibility, layout, console, and network behavior.
        run: npm run test:visual:smoke

  r-image-smoke:
    name: Build and boot production R image
    needs: browser-preflight
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build exact R runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: r-backend
          file: r-backend/Dockerfile
          load: true
          tags: traceomics-r:ci
          cache-from: type=gha,scope=production-r-image
          cache-to: type=gha,mode=max,scope=production-r-image

      - name: Verify required R packages
        run: >-
          docker run --rm --read-only --user 10001:10001
          --cap-drop ALL --security-opt no-new-privileges
          --tmpfs /tmp:rw,noexec,nosuid,nodev
          --entrypoint Rscript traceomics-r:ci -e
          "required <- c('plumber','jsonlite','digest','Seurat','hdf5r','ggplot2','base64enc','ComplexHeatmap','BiocGenerics','BiocNeighbors','clusterProfiler','fgsea','AnnotationDbi','org.Hs.eg.db','org.Mm.eg.db','GO.db','edgeR','limma','NMF','presto','CellChat'); stopifnot(all(vapply(required, requireNamespace, logical(1), quietly=TRUE))); stopifnot(identical(as.character(utils::packageVersion('CellChat')), '2.1.2'))"

      - name: Run ranked pathway enrichment in the production R image
        run: >-
          docker run --rm --read-only --user 10001:10001
          --cap-drop ALL --security-opt no-new-privileges
          --tmpfs /tmp:rw,noexec,nosuid,nodev
          --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/workspace,readonly"
          --workdir /workspace --entrypoint Rscript traceomics-r:ci
          scripts/verify_enrichment_gsea.R

      - name: Run CellChat inference in the production R image
        run: >-
          docker run --rm --read-only --user 10001:10001
          --cap-drop ALL --security-opt no-new-privileges
          --tmpfs /tmp:rw,noexec,nosuid,nodev
          --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/workspace,readonly"
          --workdir /workspace --entrypoint Rscript traceomics-r:ci
          scripts/verify_cellchat_inference.R

      - name: Boot R image and audit authenticated health
        shell: bash
        run: |
          token="$(openssl rand -hex 32)"
          container="$(docker run -d --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 1024 --memory 4g --cpus 2 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev \
            -e API_TOKEN="$token" -e PLUMBER_HOST=127.0.0.1 \
            traceomics-r:ci)"
          cleanup() {
            docker logs "$container" || true
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ready=false
          for _ in $(seq 1 90); do
            if docker exec "$container" Rscript -e \
              'con <- url("http://127.0.0.1:8000/health", open="rb", headers=c("X-API-Token"=Sys.getenv("API_TOKEN"))); payload <- jsonlite::fromJSON(con); close(con); stopifnot(identical(payload[["status"]], "ok"))' \
              >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          if docker exec "$container" Rscript -e \
            'con <- url("http://127.0.0.1:8000/health", open="rb"); readLines(con)' \
            >/dev/null 2>&1; then
            echo "Unauthenticated R health unexpectedly succeeded" >&2
            exit 1
          fi
