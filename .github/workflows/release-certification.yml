name: Release Certification

on:
  workflow_dispatch:
    inputs:
      run_full_acceptance:
        description: Run real R, private deployment, Expert R, demo, and browser acceptance
        required: true
        type: boolean
        default: true
      run_native_windows_acceptance:
        description: Run Docker plus native Electron acceptance on the dedicated self-hosted Windows runner
        required: true
        type: boolean
        default: false

concurrency:
  group: release-certification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_ENV: test
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/scrna_test

jobs:
  private-deployment-acceptance:
    if: inputs.run_full_acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 240
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scrna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run local-equivalent preflight
        run: npm run check:ci-preflight
      - name: Run real private multi-persona browser acceptance
        run: npm run test:private-compute-compose
      - name: Build the hardened Expert R broker image
        run: docker build --file deploy/expert-broker.Dockerfile --tag traceomics-expert-broker:release-test .
      - name: Run isolated Expert R acceptance
        run: npm run test:expert-r-sandbox
      - name: Run Expert R browser acceptance
        run: npm run test:expert-r-browser
      - name: Verify persistent R sessions and the authenticated console
        run: |
          docker build --file r-backend/Dockerfile --tag traceomics-r:kernel-test r-backend
          export EXPERT_R_SANDBOX_IMAGE="$(docker image inspect traceomics-r:kernel-test --format '{{.Id}}')"
          npm run test:private-r-kernel
          npm run test:private-r-console-browser
      - name: Run public-demo deployment acceptance
        run: npm run test:demo-compose

  native-windows-acceptance:
    if: inputs.run_native_windows_acceptance
    runs-on: [self-hosted, windows, traceomics-release]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run real Chromium and native Electron multi-lane acceptance
        run: npm run test:native-ui-compose
      - name: Verify the managed SSH application tunnel
        run: npm run test:desktop:tunnel-ui

  scientific-acceptance:
    if: inputs.run_full_acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scrna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          packages: |
            any::Seurat
            any::plumber
            any::ggplot2
            any::dplyr
            any::RColorBrewer
            any::jsonlite
            any::base64enc
            any::digest
            any::hdf5r
            any::edgeR
            any::limma
      - name: Verify multi-sample and multiple-condition workflow
        run: npm run test:seurat-multisample
      - name: Verify spatial transcriptomics workflow
        run: npm run test:spatial-seurat
      - name: Verify fixed condition-model R contract
        run: Rscript r-backend/tests/test_units.R
      - name: Verify exact dot-plot aggregation parity
        run: Rscript r-backend/tests/test_dot_plot_summaries.R

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
      TRACEOMICS_DESKTOP_URL: ${{ vars.TRACEOMICS_DESKTOP_URL }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Require release signing credentials
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            throw 'WINDOWS_CSC_LINK is required for a release installer.'
          }
          if ([string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw 'WINDOWS_CSC_KEY_PASSWORD is required for a release installer.'
          }
      - name: Build signed Windows installer
        run: npm run desktop:dist
      - name: Verify publisher, metadata, and release hash
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath release/desktop -Filter 'TraceOmics-Setup-*-x64.exe'
          if ($installer.Count -ne 1) {
            throw "Expected one x64 installer, found $($installer.Count)."
          }
          ./scripts/verify-windows-installer.ps1 -InstallerPath $installer.FullName
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding ascii
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: traceomics-windows-installer-${{ github.sha }}
          path: |
            release/desktop/TraceOmics-Setup-*-x64.exe
            release/desktop/TraceOmics-Setup-*-x64.exe.sha256
            release/desktop/latest.yml
          if-no-files-found: error
          retention-days: 14
