# Local/dev convenience: containerizes the private R Plumber backend and Postgres.
# This is NOT a collaborator/production deployment path. R requires an internal
# token, but that token is a privileged service credential rather than end-user
# authentication. Express remains the user-facing auth/proxy tier, and both ports
# stay bound to localhost only.
services:
  r-backend:
    build:
      context: ./r-backend
      dockerfile: Dockerfile
    ports:
      # localhost-only: Express (on the host) proxies to this; users never
      # connect to R Plumber directly.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
      - ./vault:/app/vault
    environment:
      - PLUMBER_HOST=0.0.0.0
      - PLUMBER_PORT=8000
      # Use the same R_API_TOKEN in the web and standalone-worker environments.
      # This fallback is local-only; replace it with a random secret.
      - API_TOKEN=${R_API_TOKEN:-local-dev-r-token-change-me-0000000000000000}
      - ANALYSIS_ROOT=/app
      - STORAGE_ROOT=/app/data
      - R_MAX_ACTIVE_SESSIONS=${R_MAX_ACTIVE_SESSIONS:-8}
      - R_MAX_ACTIVE_SESSIONS_PER_USER=${R_MAX_ACTIVE_SESSIONS_PER_USER:-4}
      - R_MAX_ACTIVE_SESSION_BYTES=${R_MAX_ACTIVE_SESSION_BYTES:-4294967296}
      - R_MAX_ACTIVE_SESSION_BYTES_PER_USER=${R_MAX_ACTIVE_SESSION_BYTES_PER_USER:-2147483648}
      - R_MAX_ACTIVE_SESSION_BYTES_PER_SESSION=${R_MAX_ACTIVE_SESSION_BYTES_PER_SESSION:-1073741824}
    restart: unless-stopped

  # Local/dev + CI Postgres for the hosted-service database path. This is NOT a
  # production/vendor deployment — it is a convenience database so you can develop
  # and test against Postgres (backend/pgDatabase.js + backend/pg/schema.sql)
  # without installing Postgres on the host. Initialize the schema with
  # `DATABASE_URL=postgres://scrna:scrna@localhost:5432/scrna npm run init:postgres`.
  # Bound to localhost only; do not expose this port publicly.
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=scrna
      - POSTGRES_PASSWORD=scrna
      - POSTGRES_DB=scrna
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
