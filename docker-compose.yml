# Local/dev convenience: containerizes ONLY the R Plumber backend so you don't
# have to install R/Seurat on the host. This is NOT a collaborator/production
# deployment path. The R Plumber backend is NOT authenticated and must NOT be
# the user-facing service — the Express server (server.js) is the auth/proxy
# tier and all user traffic must go through it. The port below is therefore
# bound to localhost only.
services:
  r-backend:
    build:
      context: ./r-backend
      dockerfile: Dockerfile
    ports:
      # localhost-only: Express (on the host) proxies to this; users never
      # connect to R Plumber directly.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
      - ./vault:/app/vault
    environment:
      - PORT=8000
      - ANALYSIS_ROOT=/app
      - STORAGE_ROOT=/app/data
    restart: unless-stopped

  # Local/dev + CI Postgres for the hosted-service database path. This is NOT a
  # production/vendor deployment — it is a convenience database so you can develop
  # and test against Postgres (backend/pgDatabase.js + backend/pg/schema.sql)
  # without installing Postgres on the host. Initialize the schema with
  # `DATABASE_URL=postgres://scrna:scrna@localhost:5432/scrna npm run init:postgres`.
  # Bound to localhost only; do not expose this port publicly.
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=scrna
      - POSTGRES_PASSWORD=scrna
      - POSTGRES_DB=scrna
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
