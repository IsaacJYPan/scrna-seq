<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Connect TraceOmics</title>
    <link rel="stylesheet" href="setup.css" />
    <script src="setup.js" defer></script>
  </head>
  <body>
    <main class="setup-card">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" focusable="false">
          <path d="M12 5v4.5c0 3.4 1.7 6.3 4.5 8l2.3 1.4M19 19 12.5 25.5M11 28h14M15 11h9" />
          <circle cx="25" cy="12.5" r="2.2" />
        </svg>
      </div>
      <p class="eyebrow">TraceOmics desktop</p>
      <h1>Connect to your workspace</h1>
      <p class="lede">Enter the address of your trusted TraceOmics server. Your account and research data remain on that server.</p>
      <form id="connection-form">
        <label for="server-url">Server address</label>
        <input id="server-url" name="server-url" type="url" inputmode="url" autocomplete="url" placeholder="https://analysis.example.org" required autofocus />
        <p id="error" class="error" role="alert" hidden></p>
        <button id="connect" type="submit">Connect</button>
      </form>
      <p class="hint">The app checks the connection before saving it. For local development, <code>http://localhost:3000</code> is supported.</p>
    </main>
  </body>
</html>
