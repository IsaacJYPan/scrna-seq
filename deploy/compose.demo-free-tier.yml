# Resource-constrained public-demo profile for a 2-OCPU / 12-GB ARM64 host.
# Always layer this after compose.single-host.yml and compose.demo.yml. These
# limits are for the bundled 800-cell synthetic tutorial only, not research data.
services:
  namespace-anchor:
    mem_limit: 48m
    cpus: 0.10

  postgres:
    command: ["postgres", "-c", "listen_addresses=127.0.0.1", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
    shm_size: 128m
    mem_limit: 768m
    cpus: 0.30

  storage-init:
    mem_limit: 96m
    cpus: 0.10

  r:
    environment:
      R_MAX_ACTIVE_SESSIONS: "4"
      R_MAX_ACTIVE_SESSIONS_PER_USER: "1"
      R_MAX_ACTIVE_SESSION_BYTES: "1610612736"
      R_MAX_ACTIVE_SESSION_BYTES_PER_USER: "805306368"
      R_MAX_ACTIVE_SESSION_BYTES_PER_SESSION: "805306368"
    mem_limit: 2g
    cpus: 0.35
    pids_limit: 512

  r-compute-1:
    environment:
      R_MAX_ACTIVE_SESSION_BYTES: "1610612736"
      R_MAX_ACTIVE_SESSION_BYTES_PER_USER: "1610612736"
      R_MAX_ACTIVE_SESSION_BYTES_PER_SESSION: "1073741824"
    mem_limit: 2560m
    cpus: 0.65
    pids_limit: 768

  r-compute-2:
    environment:
      R_MAX_ACTIVE_SESSION_BYTES: "1610612736"
      R_MAX_ACTIVE_SESSION_BYTES_PER_USER: "1610612736"
      R_MAX_ACTIVE_SESSION_BYTES_PER_SESSION: "1073741824"
    mem_limit: 2560m
    cpus: 0.65
    pids_limit: 768

  web:
    mem_limit: 512m
    cpus: 0.25
    pids_limit: 192

  worker:
    environment:
      JOB_WORKER_MIN_FREE_MEMORY_MB: "256"
    mem_limit: 384m
    cpus: 0.15
    pids_limit: 160

  worker-compute-1:
    environment:
      JOB_WORKER_MIN_FREE_MEMORY_MB: "256"
    mem_limit: 384m
    cpus: 0.25
    pids_limit: 192

  worker-compute-2:
    environment:
      JOB_WORKER_MIN_FREE_MEMORY_MB: "256"
    mem_limit: 384m
    cpus: 0.25
    pids_limit: 192

  operations:
    mem_limit: 512m
    cpus: 0.25

  restore-operations:
    mem_limit: 512m
    cpus: 0.25

  demo-cleanup:
    mem_limit: 384m
    cpus: 0.20

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.4-alpine}
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,nodev,size=32m]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set the public DNS hostname}
    volumes:
      - ./Caddyfile.demo-free-tier:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [private-backend]
    depends_on:
      namespace-anchor:
        condition: service_started
      web:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.15
    pids_limit: 96

  demo-template-prepare:
    image: ${APP_IMAGE:-traceomics:single-host}
    profiles: [demo-bootstrap]
    command: ["node", "scripts/bootstrap-demo-template.js", "prepare"]
    network_mode: service:namespace-anchor
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,nodev,size=64m]
    environment: &demo-bootstrap-environment
      NODE_ENV: production
      HOME: /tmp
      APP_DEPLOYMENT_MODE: demo
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      STORAGE_ROOT: /app/storage-volume/data
      VAULT_ROOT: /app/vault-volume/vault
    volumes:
      - durable-storage:/app/storage-volume
      - legacy-vault:/app/vault-volume
    depends_on:
      postgres: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
    restart: "no"
    mem_limit: 384m
    cpus: 0.25
    pids_limit: 128

  demo-template-r:
    image: ${R_IMAGE:-traceomics-r:single-host}
    profiles: [demo-bootstrap]
    entrypoint: ["Rscript"]
    command: ["/app/generate-demo-template.R"]
    network_mode: service:namespace-anchor
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,nodev,size=128m]
    environment:
      HOME: /tmp
      STORAGE_ROOT: /app/storage-volume/data
    volumes:
      - durable-storage:/app/storage-volume
    depends_on:
      storage-init: { condition: service_completed_successfully }
    restart: "no"
    mem_limit: 2560m
    cpus: 1.0
    pids_limit: 768

  demo-template-finalize:
    image: ${APP_IMAGE:-traceomics:single-host}
    profiles: [demo-bootstrap]
    command: ["node", "scripts/bootstrap-demo-template.js", "finalize"]
    network_mode: service:namespace-anchor
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,nodev,size=64m]
    environment: *demo-bootstrap-environment
    volumes:
      - durable-storage:/app/storage-volume
      - legacy-vault:/app/vault-volume
    depends_on:
      postgres: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
    restart: "no"
    mem_limit: 384m
    cpus: 0.25
    pids_limit: 128

volumes:
  caddy-data:
  caddy-config:
