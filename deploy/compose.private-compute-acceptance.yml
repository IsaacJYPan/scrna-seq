# Test-only overlay for deterministic two-lane real-R acceptance. It changes no
# production listener, worker capability, mount, or concurrency setting. The
# diagnostic delay is admitted only because these two R services run with
# NODE_ENV=test; plumber.R refuses it in production.
services:
  web:
    volumes:
      - ../scripts/compose-private-compute-inner.js:/app/acceptance/compose-private-compute-inner.js:ro

  r-compute-1:
    environment:
      NODE_ENV: test
      ENABLE_R_TEST_DIAGNOSTICS: "true"
      R_TEST_DEG_DELAY_MS: "60000"

  r-compute-2:
    environment:
      NODE_ENV: test
      ENABLE_R_TEST_DIAGNOSTICS: "true"
      R_TEST_DEG_DELAY_MS: "60000"

  worker:
    environment:
      JOB_WORKER_MIN_FREE_MEMORY_MB: "1"

  worker-compute-1:
    environment:
      JOB_WORKER_MIN_FREE_MEMORY_MB: "1"
      JOB_WORKER_LEASE_SECONDS: "30"

  worker-compute-2:
    environment:
      JOB_WORKER_MIN_FREE_MEMORY_MB: "1"
      JOB_WORKER_LEASE_SECONDS: "30"
